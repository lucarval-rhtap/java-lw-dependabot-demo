spring.application.name=spring-boot-lw-poc
server.port=8080

# OpenAPI contract (API-first) — served from openapi/openapi.yaml copied at build time.
# springdoc requires api-docs enabled for Swagger UI auto-configuration; the UI still loads the
# authored contract below (not the runtime-generated /v3/api-docs).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.url=/openapi/openapi.yaml
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

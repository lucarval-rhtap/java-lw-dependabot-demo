version: 2

registries:
  lightwell-remediated:
    type: maven-repository
    url: https://packages.redhat.com/lightwell/java/remediated/
    username: ${{ secrets.LIGHTWELL_USERNAME }}
    password: ${{ secrets.LIGHTWELL_TOKEN }}

updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - lightwell-remediated
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "lightwell"
    # Dependabot always queries Maven Central alongside configured registries, and a
    # newer upstream release (e.g. 2.22.4) always outcompetes a remediated version on
    # the same line (e.g. 2.21.1.rhlw-00002). Suppress major/minor upstream bumps so
    # only patch-level updates pass through — which is where .rhlw remediations live.
    # To take an upstream major/minor upgrade, bump the version manually or comment
    # this block out.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
